<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1차 원작 IP 20개 분석</title><link rel="stylesheet" href="auth.css?v=20261009a"><link rel="stylesheet" href="review.css?v=20261009a"></head>
<body><main class="app-shell"><a href="./">← 대시보드</a> · <a href="candidates.html">100개 후보 목록</a><h1>1차 원작 IP 20개 분석</h1><p>원작 정보와 공개 판권 자료를 검토한 첫 분석입니다. 정보가 부족한 작품은 잠정 점수와 추가 조사 사항을 함께 기록했습니다.</p><p id="batchSummary" role="status">분석을 불러오고 있습니다.</p>
<section class="auth-panel"><p id="authStatus" role="status" aria-live="polite">로그인 상태 확인 중</p><form id="authForm"><label for="authEmail">로그인 이메일</label><input id="authEmail" type="email" autocomplete="email" required><button id="authSend" type="submit">로그인 링크 받기</button></form><button id="authLogout" type="button" hidden>로그아웃</button></section>
<section class="apply-panel"><h2>대시보드에 추가</h2><p>소유자 로그인 후 아래 버튼을 누르면 신규 분석을 한 번에 추가합니다. 기존 작품·메모·관심 표시는 보존됩니다. 이미 같은 제목이 등록되어 있거나 분석이 달라진 경우 덮어쓰지 않고 중단합니다.</p><button id="batchApply" type="button" disabled>1차 20개 업로드</button><button id="batchRefresh" type="button">업로드 상태 확인</button><p id="applyStatus" role="status" aria-live="polite"></p></section>
<section><h2>작품별 분석</h2><label for="batchSearch">작품 검색</label><input id="batchSearch" type="search" placeholder="제목 검색"><div id="batchList"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20261009a"></script><script src="batch.js?v=20261009b"></script></body></html>
